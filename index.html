<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArenaCash — Indique um amigo e ganhe R$ 50</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f9ff;
      color: #0b1f3a;
    }

    .slide {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #ffffff 0%, #eef6ff 100%);
    }

    .slide::before {
      content: "";
      position: absolute;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: #0d6efd;
      opacity: 0.08;
      top: -180px;
      right: -100px;
    }

    .slide::after {
      content: "";
      position: absolute;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      background: #0d6efd;
      opacity: 0.06;
      bottom: -180px;
      left: -100px;
    }

    .content {
      width: 100%;
      max-width: 1100px;
      position: relative;
      z-index: 1;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 70px;
      color: #0d6efd;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: #0d6efd;
      display: grid;
      place-items: center;
      color: #ffffff;
      font-size: 20px;
      font-weight: 900;
      box-shadow: 0 8px 20px rgba(13, 110, 253, 0.25);
    }

    .badge {
      display: inline-block;
      margin-bottom: 22px;
      padding: 9px 16px;
      border-radius: 999px;
      background: #e4f0ff;
      color: #0d6efd;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    h1 {
      max-width: 850px;
      font-size: clamp(48px, 7vw, 88px);
      line-height: 0.98;
      letter-spacing: -4px;
      margin-bottom: 28px;
    }

    h1 span {
      color: #0d6efd;
    }

    .subtitle {
      max-width: 650px;
      font-size: 21px;
      line-height: 1.55;
      color: #52657d;
      margin-bottom: 40px;
    }

    .button {
      display: inline-block;
      padding: 16px 28px;
      border-radius: 12px;
      background: #0d6efd;
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(13, 110, 253, 0.25);
    }

    .button:hover {
      background: #095dcc;
    }

    .reward {
      position: absolute;
      right: 8%;
      top: 50%;
      transform: translateY(-35%);
      width: 230px;
      height: 230px;
      border-radius: 50%;
      background: #ffffff;
      border: 1px solid #dceaff;
      box-shadow: 0 25px 70px rgba(13, 70, 130, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .reward strong {
      color: #0d6efd;
      font-size: 46px;
      letter-spacing: -2px;
    }

    .reward span {
      color: #52657d;
      font-size: 14px;
      font-weight: 700;
      margin-top: 5px;
    }

    @media (max-width: 800px) {
      .slide {
        padding: 35px 25px;
      }

      .brand {
        margin-bottom: 50px;
      }

      h1 {
        letter-spacing: -2px;
      }

      .reward {
        display: none;
      }
    }
  </style>
</head>

<body>
  <main class="slide">
    <div class="content">
      <div class="brand">
        <div class="brand-mark">A</div>
        ArenaCash
      </div>

      <div class="badge">Campanha especial da Arena Cash 2</div>

      <h1>
        Indique um amigo<br>
        e ganhe <span>R$ 50</span>
      </h1>

      <p class="subtitle">
        Compartilhe a ArenaCash com quem você gosta e ganhe R$ 50
        quando seu amigo começar a usar nossa fintech.
      </p>

      <a href="#" class="button">Saiba mais</a>
    </div>

    <div class="reward" aria-label="Recompensa de 50 reais">
      <strong>R$ 50</strong>
      <span>por indicação</span>
    </div>
  </main>
</body>
</html>
